<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>灵狐桌宠 · 三状态预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e9ecf5; font-family: -apple-system, "PingFang SC", sans-serif; padding: 30px; }
  h1 { font-size: 16px; color: #444; margin-bottom: 20px; }
  .row { display: flex; gap: 30px; }
  .cell { background: #fff; border-radius: 16px; padding: 16px; width: 220px; text-align: center; box-shadow: 0 6px 20px rgba(40,50,90,.1); }
  .title { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
  .bubble { display:inline-block; margin-bottom: 6px; padding: 4px 10px; border-radius: 12px; background: rgba(30,30,40,.88); color:#fff; font-size: 11px; }
  .petBox { position: relative; height: 200px; display: flex; align-items: flex-end; justify-content: center; }
  .pet { width: 130px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)); transform-origin: bottom center; }
  .pet.tired { filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)) saturate(.65) brightness(.92); animation: sway 2.4s ease-in-out infinite; }
  .pet.happy { filter: drop-shadow(0 8px 14px rgba(120,90,255,.35)) saturate(1.15) brightness(1.06); animation: bounce .6s ease infinite; }
  .pet.normal { animation: float 3.6s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes sway  { 0%,100%{transform:rotate(-3.5deg)} 50%{transform:rotate(3.5deg)} }
  @keyframes bounce{ 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-12px) scale(1.04)} }
  .emote { position:absolute; top: 10px; right: 40px; font-size: 22px; }
  .stats { margin-top: 6px; font-size: 10px; color:#fff; background: rgba(30,30,40,.82); padding: 2px 8px; border-radius: 8px; display:inline-block; }
</style>
</head>
<body>
  <h1>灵狐桌宠 · 三状态预览（正常 / 等 AI 久坐疲惫 / 完成后开心）</h1>
  <div class="row">
    <div class="cell">
      <div class="title">正常</div>
      <div class="bubble">在等 AI 的时候，记得照顾身体 🫶</div>
      <div class="petBox"><img class="pet normal" src="../assets/character/fox.png" /></div>
      <div class="stats">完成 3 · 跳过 1 · 喝水 2 · 连续 5 天</div>
    </div>
    <div class="cell">
      <div class="title">疲惫（久坐太久）</div>
      <div class="bubble">坐太久啦，起来动动吧～</div>
      <div class="petBox"><img class="pet tired" src="../assets/character/fox.png" /><div class="emote">💤</div></div>
      <div class="stats">完成 3 · 跳过 1 · 喝水 2 · 连续 5 天</div>
    </div>
    <div class="cell">
      <div class="title">开心（刚完成动作）</div>
      <div class="bubble">太棒了！身体谢谢你 ✨</div>
      <div class="petBox"><img class="pet happy" src="../assets/character/fox.png" /><div class="emote">✨</div></div>
      <div class="stats">完成 4 · 跳过 1 · 喝水 2 · 连续 5 天</div>
    </div>
  </div>
</body>
</html>
