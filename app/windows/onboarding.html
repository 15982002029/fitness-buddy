<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", sans-serif; user-select: none; }
  html, body { background: transparent; overflow: hidden; }
  #card {
    margin: 10px; height: calc(100vh - 20px);
    background: linear-gradient(165deg, #ffffff 0%, #f2f4ff 100%);
    border-radius: 22px; box-shadow: 0 18px 54px rgba(40,50,90,.32);
    border: 1px solid rgba(120,130,200,.18);
    padding: 22px 24px 18px; display: flex; flex-direction: column;
  }
  /* 顶部：进度点 + 跳过 */
  .top { display: flex; align-items: center; margin-bottom: 6px; height: 16px; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d7dbf0; transition: .2s; }
  .dot.on { background: #6c7cff; width: 18px; border-radius: 4px; }
  .skip { margin-left: auto; font-size: 11px; color: #b3b7d0; cursor: pointer; }
  .skip:hover { color: #6c7cff; }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; }
  .body.top { justify-content: flex-start; }
  .fox { width: 120px; margin: 0 auto 8px; display: block; filter: drop-shadow(0 6px 12px rgba(0,0,0,.2)); animation: float 3.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  h1 { font-size: 20px; color: #232544; text-align: center; }
  .lead { font-size: 13px; color: #7a7fa6; text-align: center; line-height: 1.7; margin-top: 10px; }
  .q { font-size: 17px; font-weight: 700; color: #232544; margin-bottom: 4px; }
  .qsub { font-size: 12px; color: #9498bc; margin-bottom: 16px; }
  .gtitle { font-size: 12.5px; font-weight: 700; color: #6c7cff; margin: 14px 0 8px; }
  .gtitle:first-of-type { margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .chip { background: #f0f2ff; border: 1px solid #c7cdf5; color: #4b54c4; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }
  .chip b { color: #a0a4c8; font-weight: 400; margin-left: 2px; }
  .chip:hover { background: #ffe9ec; border-color: #f0b6c0; color: #c0455e; }
  .ci { border: 1px dashed #c7cdf5; background: transparent; border-radius: 20px; padding: 6px 12px; font-size: 12.5px; font-family: inherit; outline: none; width: 92px; color: #4b54c4; }
  .ci:focus { border-style: solid; border-color: #6c7cff; width: 130px; }
  .ci::placeholder { color: #b3b7d0; }

  .opts { display: flex; flex-direction: column; gap: 9px; }
  .opts.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .opt {
    border: 1.5px solid #e3e6f5; border-radius: 13px; padding: 12px 14px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: .15s; background: #fff;
  }
  .opt:hover { border-color: #b9c0f0; }
  .opt.sel { border-color: #6c7cff; background: #f0f2ff; box-shadow: 0 2px 10px rgba(108,124,255,.15); }
  .opt .ico { font-size: 20px; }
  .opt .t { font-size: 13.5px; color: #2f3357; font-weight: 600; }
  .opt .d { font-size: 11px; color: #9498bc; margin-top: 1px; }
  .opt .col { display: flex; flex-direction: column; }
  .check { margin-left: auto; color: #6c7cff; font-weight: 700; opacity: 0; }
  .opt.sel .check { opacity: 1; }

  .dnd { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .dnd input { padding: 6px 8px; border: 1px solid #d7dbf0; border-radius: 8px; font-size: 13px; }
  .dnd .lbl { font-size: 12px; color: #9498bc; }

  .nav { display: flex; gap: 10px; margin-top: 16px; }
  button { border: none; border-radius: 12px; padding: 12px 0; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: transform .1s, opacity .15s; }
  button:active { transform: scale(.97); }
  #back { flex: .55; background: #eceeff; color: #6a6f9c; }
  #next { flex: 1; background: #6c7cff; color: #fff; }
  #next:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
  <div id="card">
    <div class="top">
      <div class="dots" id="dots"></div>
      <span class="skip" id="skip">跳过，用默认 →</span>
    </div>
    <div class="body" id="body"></div>
    <div class="nav">
      <button id="back" style="display:none">上一步</button>
      <button id="next">开始</button>
    </div>
  </div>

<script>
  const answers = { activities: [], workStyle: '', frequency: '', intensity: '', duration: '', dndStart: '', dndEnd: '' };

  const STEPS = [
    { type: 'welcome' },
    {
      type: 'activities', key: 'activities', q: '休息时你愿意做什么？',
      sub: '下面只是灵感 —— 勾你会做的，每个大类都能自己加',
      groups: [
        { id: 'eyecare', title: '🌿 护眼养神', opts: [
          { t: '远眺护眼', cat: 'eyes', ico: '👀' }, { t: '深呼吸', cat: 'breathing', ico: '🌬' }
        ] },
        { id: 'stretch', title: '🧣 舒展筋骨', opts: [
          { t: '肩颈舒缓', cat: 'shoulder_neck', ico: '🧣' }, { t: '腰背舒展', cat: 'back', ico: '🔄' },
          { t: '手腕活动', cat: 'wrist', ico: '✋' }
        ] },
        { id: 'move', title: '🏃 起身活动', opts: [
          { t: '起身走动', cat: 'stand', ico: '🧍' }, { t: '原地踏步', cat: 'legs', ico: '🦵' }
        ] },
        { id: 'energy', title: '💧 补充能量', opts: [
          { t: '喝水', cat: 'water', ico: '💧' }, { t: '接杯茶/咖啡', ico: '☕' }
        ] },
        { id: 'intense', title: '💪 来点强度', opts: [
          { t: '跳绳', ico: '🪢' }, { t: '俯卧撑', ico: '💪' }, { t: '深蹲', ico: '🏋' }
        ] }
      ]
    },
    {
      type: 'single', key: 'workStyle', q: '你平时怎么工作？', sub: '决定灵狐主要在什么时候出现',
      opts: [
        { v: 'wait_ai', ico: '🤖', t: '常等 AI 跑', d: 'vibe coding，等回复的间隙最多' },
        { v: 'deep_focus', ico: '🎯', t: '长时间专注不停手', d: '一写就是一两小时' },
        { v: 'meetings', ico: '💬', t: '会议 / 离开多', d: '经常开会、离开电脑' }
      ]
    },
    {
      type: 'single', key: 'frequency', q: '希望多久提醒一次？', sub: '之后随时能在面板里调',
      opts: [
        { v: 'dense', ico: '🔔', t: '密集', d: '大约每 20 分钟' },
        { v: 'medium', ico: '🌤', t: '适中', d: '大约每 35 分钟（推荐）' },
        { v: 'sparse', ico: '🍃', t: '稀疏', d: '大约每 60 分钟' }
      ]
    },
    {
      type: 'single', key: 'intensity', q: '希望灵狐多“坚持”？', sub: '你爱跳过的话，坚定一点更有用',
      opts: [
        { v: 'gentle', ico: '🫧', t: '温柔', d: '轻轻提示，随手就能跳过' },
        { v: 'firm', ico: '💪', t: '坚定', d: '更早抓住你、更会催你动' }
      ]
    },
    {
      type: 'single', key: 'duration', q: '每次想活动多久？', sub: '灵狐会挑合适时长的动作', dnd: true,
      opts: [
        { v: 'short', ico: '⚡', t: '30 秒就好', d: '快速回血' },
        { v: 'medium', ico: '⏳', t: '1-2 分钟', d: '舒展开一点' },
        { v: 'any', ico: '🎲', t: '都行', d: '交给灵狐安排' }
      ]
    },
    { type: 'finish' }
  ];

  let step = 0;
  const body = document.getElementById('body');
  const dotsEl = document.getElementById('dots');
  const nextBtn = document.getElementById('next');
  const backBtn = document.getElementById('back');

  function renderDots() {
    dotsEl.innerHTML = '';
    STEPS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === step ? ' on' : '');
      dotsEl.appendChild(d);
    });
  }

  function optionCard(o, selected) {
    const hasDesc = !!o.d;
    return `<div class="opt${selected ? ' sel' : ''}" data-v="${o.v}">
      <span class="ico">${o.ico}</span>
      <span class="col"><span class="t">${o.t}</span>${hasDesc ? `<span class="d">${o.d}</span>` : ''}</span>
      <span class="check">✓</span>
    </div>`;
  }

  function render() {
    const s = STEPS[step];
    renderDots();
    body.classList.toggle('top', s.type === 'activities'); // 活动题内容多，顶部对齐避免被裁
    backBtn.style.display = step > 0 && s.type !== 'finish' ? 'block' : (step > 0 ? 'block' : 'none');

    if (s.type === 'welcome') {
      body.innerHTML = `
        <img class="fox" src="../../assets/character/fox.png" />
        <h1>你好，我是灵狐 🦊</h1>
        <p class="lead">我会在你写代码久了、或等 AI 回复的间隙<br>轻轻提醒你活动一下身体。<br><br>先花 20 秒告诉我你的习惯，<br>我就能更懂你。</p>`;
      nextBtn.textContent = '开始';
      nextBtn.disabled = false;
      return;
    }

    if (s.type === 'finish') {
      const acts = answers.activities.map((a) => a.label).join('、') || '各种小活动';
      body.innerHTML = `
        <img class="fox" src="../../assets/character/fox.png" />
        <h1>好啦，交给我 ✨</h1>
        <p class="lead">休息时我只会提醒你做：<br><b style="color:#6c7cff">${acts}</b><br>用你选的节奏。<br><br>之后想改，点我一下就能进设置。</p>`;
      nextBtn.textContent = '开始使用';
      nextBtn.disabled = false;
      backBtn.style.display = 'block';
      return;
    }

    // 活动选择步骤：每个大类 = 启发预设 + 该类自己加
    if (s.type === 'activities') {
      const chosen = answers[s.key]; // [{label, cat?, group}]
      const has = (label) => chosen.some((a) => a.label === label);
      const presetLabels = new Set(s.groups.flatMap((g) => g.opts.map((o) => o.t)));
      let gh = `<div class="q">${s.q}</div><div class="qsub">${s.sub}</div>`;

      s.groups.forEach((g) => {
        gh += `<div class="gtitle">${g.title}</div><div class="opts grid">`;
        g.opts.forEach((o) => {
          gh += `<div class="opt${has(o.t) ? ' sel' : ''}" data-label="${o.t}" data-cat="${o.cat || ''}" data-group="${g.id}">
            <span class="ico">${o.ico}</span><span class="col"><span class="t">${o.t}</span></span>
            <span class="check">✓</span></div>`;
        });
        gh += `</div>`;
        // 该大类里用户自己加的
        const mine = chosen.filter((a) => a.group === g.id && !presetLabels.has(a.label));
        gh += `<div class="chips">`;
        mine.forEach((a) => { gh += `<span class="chip" data-label="${a.label}">${a.label} <b>×</b></span>`; });
        gh += `<span class="addmini"><input type="text" class="ci" data-group="${g.id}" placeholder="自己加…" maxlength="16" /></span>`;
        gh += `</div>`;
      });

      body.innerHTML = gh;
      nextBtn.textContent = '下一步';

      // 预设点选
      body.querySelectorAll('.opt').forEach((el) => {
        el.onclick = () => {
          const label = el.dataset.label;
          const cat = el.dataset.cat || undefined;
          const group = el.dataset.group;
          const i = chosen.findIndex((a) => a.label === label);
          if (i >= 0) chosen.splice(i, 1); else chosen.push({ label, cat, group });
          render();
        };
      });
      // 每个大类的自定义输入（回车添加，带 group）
      body.querySelectorAll('.ci').forEach((inp) => {
        inp.onkeydown = (e) => {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          const v = (inp.value || '').trim();
          const group = inp.dataset.group;
          if (v && !chosen.some((a) => a.label === v)) chosen.push({ label: v, group });
          render();
        };
      });
      // 删除自定义
      body.querySelectorAll('.chip').forEach((el) => {
        el.onclick = () => {
          const i = chosen.findIndex((a) => a.label === el.dataset.label);
          if (i >= 0) { chosen.splice(i, 1); render(); }
        };
      });
      updateNextEnabled();
      return;
    }

    // 问题步骤（single / multi）
    const sel = s.type === 'multi' ? answers[s.key] : [answers[s.key]];
    let html = `<div class="q">${s.q}</div><div class="qsub">${s.sub}</div>`;
    html += `<div class="opts${s.grid ? ' grid' : ''}">` + s.opts.map((o) => optionCard(o, sel.includes(o.v))).join('') + `</div>`;
    if (s.dnd) {
      html += `<div class="dnd"><span class="lbl">勿扰时段（可选）</span>
        <input type="time" id="dndStart" value="${answers.dndStart}"> - <input type="time" id="dndEnd" value="${answers.dndEnd}"></div>`;
    }
    body.innerHTML = html;
    nextBtn.textContent = '下一步';

    body.querySelectorAll('.opt').forEach((el) => {
      el.onclick = () => {
        const v = el.dataset.v;
        if (s.type === 'multi') {
          const arr = answers[s.key];
          const i = arr.indexOf(v);
          if (i >= 0) arr.splice(i, 1); else arr.push(v);
        } else {
          answers[s.key] = v;
        }
        render();
      };
    });
    if (s.dnd) {
      body.querySelector('#dndStart').onchange = (e) => (answers.dndStart = e.target.value);
      body.querySelector('#dndEnd').onchange = (e) => (answers.dndEnd = e.target.value);
    }
    updateNextEnabled();
  }

  function updateNextEnabled() {
    const s = STEPS[step];
    if (s.type === 'single') nextBtn.disabled = !answers[s.key];
    else nextBtn.disabled = false; // 多选/分组可不选（默认全部）
  }

  nextBtn.onclick = () => {
    const s = STEPS[step];
    if (s.type === 'finish') { window.buddy.submitOnboarding(answers); return; }
    if (s.type === 'single' && !answers[s.key]) return;
    step++;
    render();
  };
  backBtn.onclick = () => { if (step > 0) { step--; render(); } };
  document.getElementById('skip').onclick = () => window.buddy.skipOnboarding();

  render();
</script>
</body>
</html>
