<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "PingFang SC", sans-serif; }
  html, body { background: transparent; overflow: hidden; }
  #card {
    margin: 10px; height: calc(100vh - 20px);
    background: linear-gradient(165deg, #ffffff 0%, #f4f6ff 100%);
    border-radius: 18px; box-shadow: 0 14px 46px rgba(40,50,90,.3);
    border: 1px solid rgba(120,130,200,.18);
    padding: 16px 18px; display: flex; flex-direction: column;
  }
  h2 { font-size: 15px; color: #232544; display: flex; align-items: center; gap: 8px; }
  h2 .fox { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; object-position: top; }
  .close { margin-left: auto; cursor: pointer; color: #b3b7d0; font-size: 16px; line-height: 1; }
  .close:hover { color: #6c7cff; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 6px; }
  .stat { background: #eef0ff; border-radius: 10px; padding: 8px 4px; text-align: center; }
  .stat .n { font-size: 18px; font-weight: 700; color: #4b54c4; }
  .stat .l { font-size: 10px; color: #8a8fb5; margin-top: 2px; }
  .sub { font-size: 11px; color: #9094b8; margin-bottom: 8px; }

  .section { flex: 1; overflow-y: auto; padding-right: 2px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #eef0f7; }
  .row label { font-size: 12.5px; color: #3c3f63; }
  .row .hint { font-size: 10px; color: #a8acc8; display: block; margin-top: 1px; }
  input[type=number] { width: 58px; padding: 4px 6px; border: 1px solid #d7dbf0; border-radius: 7px; font-size: 12px; text-align: right; }
  input[type=time] { padding: 3px 5px; border: 1px solid #d7dbf0; border-radius: 7px; font-size: 11px; }
  .switch { position: relative; width: 38px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #d3d7ea; border-radius: 22px; cursor: pointer; transition: .2s; }
  .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #6c7cff; }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  .btns { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; border: none; border-radius: 10px; padding: 10px 0; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: transform .1s; }
  button:active { transform: scale(.97); }
  #do { background: #eef0ffe0; color: #5a5f8c; }
  #save { background: #6c7cff; color: #fff; }
  #saved { font-size: 11px; color: #37b26b; text-align: center; height: 14px; margin-top: 6px; opacity: 0; transition: opacity .2s; }
</style>
</head>
<body>
  <div id="card">
    <h2>
      <img class="fox" src="../../assets/character/fox.png" />
      健身助手
      <span class="close" id="close">✕</span>
    </h2>

    <div class="stats">
      <div class="stat"><div class="n" id="s-done">0</div><div class="l">完成</div></div>
      <div class="stat"><div class="n" id="s-skip">0</div><div class="l">跳过</div></div>
      <div class="stat"><div class="n" id="s-water">0</div><div class="l">喝水</div></div>
      <div class="stat"><div class="n" id="s-streak">0</div><div class="l">连续天</div></div>
    </div>
    <div class="sub" id="s-active">今日活动 0 分钟</div>

    <div class="section">
      <div class="row">
        <label>等 AI 判定<span class="hint">停手多少秒算在等 AI 回复</span></label>
        <div><input type="number" id="aiWaitIdleSec" min="5" max="300"> 秒</div>
      </div>
      <div class="row">
        <label>提醒冷却<span class="hint">两次提醒最小间隔</span></label>
        <div><input type="number" id="reminderCooldownMin" min="1" max="180"> 分</div>
      </div>
      <div class="row">
        <label>久坐兜底<span class="hint">坐多久必提醒一次</span></label>
        <div><input type="number" id="maxSittingMin" min="10" max="240"> 分</div>
      </div>
      <div class="row">
        <label>喝水提醒<span class="hint">多久提醒喝一次水</span></label>
        <div><input type="number" id="waterIntervalMin" min="10" max="360"> 分</div>
      </div>
      <div class="row">
        <label>勿扰时段<span class="hint">这段时间内不提醒</span></label>
        <div><input type="time" id="dndStart"> - <input type="time" id="dndEnd"></div>
      </div>
      <div class="row">
        <label>开机自启</label>
        <div class="switch"><input type="checkbox" id="autostart"><span class="slider"></span></div>
      </div>
    </div>

    <div class="btns">
      <button id="do">来个小动作</button>
      <button id="save">保存设置</button>
    </div>
    <div id="saved">已保存 ✓</div>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  const numFields = ['aiWaitIdleSec', 'reminderCooldownMin', 'maxSittingMin', 'waterIntervalMin'];

  async function load() {
    const { settings, stats, autostart } = await window.buddy.getPanelData();
    $('s-done').textContent = stats.completedCount;
    $('s-skip').textContent = stats.skippedCount;
    $('s-water').textContent = stats.waterCount;
    $('s-streak').textContent = stats.streak;
    $('s-active').textContent = `今日活动 ${Math.round((stats.activeBreakSeconds || 0) / 60)} 分钟`;
    numFields.forEach((k) => { $(k).value = settings[k]; });
    $('dndStart').value = settings.dndStart || '';
    $('dndEnd').value = settings.dndEnd || '';
    $('autostart').checked = !!autostart;
  }

  $('save').onclick = async () => {
    const patch = {};
    numFields.forEach((k) => { patch[k] = Number($(k).value); });
    patch.dndStart = $('dndStart').value;
    patch.dndEnd = $('dndEnd').value;
    await window.buddy.saveSettings(patch);
    await window.buddy.setAutostart($('autostart').checked);
    const s = $('saved'); s.style.opacity = 1; setTimeout(() => (s.style.opacity = 0), 1500);
  };

  $('do').onclick = () => window.buddy.doExercise();
  $('close').onclick = () => window.buddy.closePanel();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.buddy.closePanel(); });

  load();
</script>
</body>
</html>
