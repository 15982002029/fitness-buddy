<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: transparent; overflow: hidden; font-family: -apple-system, "PingFang SC", sans-serif; }
  #wrap {
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    cursor: grab;
  }
  #wrap:active { cursor: grabbing; }
  #petBox { position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; width: 100%; }
  #pet {
    width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.28));
    transition: filter .4s ease, transform .3s ease;
    animation: float 3.6s ease-in-out infinite;
    transform-origin: bottom center;
  }
  /* 疲惫：轻微降饱和、发暗、缓慢摇晃 */
  #pet.tired {
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.28)) saturate(.65) brightness(.92);
    animation: sway 2.4s ease-in-out infinite;
  }
  /* 开心：提亮、轻微放大、欢快弹跳 */
  #pet.happy {
    filter: drop-shadow(0 8px 14px rgba(120,90,255,.35)) saturate(1.15) brightness(1.06);
    animation: bounce .6s ease infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes sway  { 0%,100%{transform:rotate(-3.5deg)} 50%{transform:rotate(3.5deg)} }
  @keyframes bounce{ 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-12px) scale(1.04)} }

  /* 状态角标：疲惫冒 Zzz，开心冒 ✨ */
  #emote {
    position: absolute; top: 4%; right: 6%; font-size: 20px; opacity: 0;
    transition: opacity .3s; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3));
  }
  #pet.tired ~ #emote { opacity: 1; animation: rise 2.5s ease-in-out infinite; }
  #pet.happy ~ #emote { opacity: 1; animation: pop .6s ease infinite; }
  @keyframes rise { 0%{transform:translateY(4px);opacity:.3} 50%{opacity:1} 100%{transform:translateY(-8px);opacity:0} }
  @keyframes pop  { 0%,100%{transform:scale(.9)} 50%{transform:scale(1.25)} }

  #bubble {
    margin-bottom: 4px; padding: 4px 10px; border-radius: 12px;
    background: rgba(30,30,40,.88); color: #fff; font-size: 11px; white-space: nowrap;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #wrap:hover #bubble { opacity: 1; }
  #info {
    margin-top: 2px; display: flex; flex-direction: column; gap: 2px; align-items: center;
    opacity: 0; transition: opacity .2s;
  }
  #wrap:hover #info { opacity: 1; }
  #sitline, #stats {
    font-size: 10px; color: #fff;
    background: rgba(30,30,40,.82); padding: 2px 8px; border-radius: 8px;
    white-space: nowrap;
  }
  #sitline b { color: #ffd479; font-weight: 600; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="bubble">在等 AI 的时候，记得照顾身体 🫶</div>
    <div id="petBox">
      <img id="pet" src="../../assets/character/fox.png" alt="灵狐" draggable="false" />
      <div id="emote">💤</div>
    </div>
    <div id="info">
      <div id="sitline">刚坐下</div>
      <div id="stats">加载中…</div>
    </div>
  </div>
<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');
  const statsEl = document.getElementById('stats');
  const emote = document.getElementById('emote');

  const WORD = {
    normal: '在等 AI 的时候，记得照顾身体 🫶',
    tired: '坐太久啦，起来动动吧～',
    happy: '太棒了！身体谢谢你 ✨'
  };
  const EMOTE = { normal: '', tired: '💤', happy: '✨' };

  let curState = 'normal';
  let lastWear = 0;

  // 灵狐随连坐时间渐变：坐越久越蔫（降饱和、变暗、微微垂头）。
  // 只在 normal 状态下生效；tired/happy 有自己的 class 样式。
  function applyWear(wear) {
    lastWear = wear;
    if (curState !== 'normal') { pet.style.filter = ''; pet.style.transform = ''; return; }
    const sat = (1 - 0.4 * wear).toFixed(2);
    const bri = (1 - 0.08 * wear).toFixed(2);
    pet.style.filter = `drop-shadow(0 6px 10px rgba(0,0,0,.28)) saturate(${sat}) brightness(${bri})`;
  }

  window.buddy.onPetState(({ state }) => {
    curState = state;
    pet.className = state === 'normal' ? '' : state;
    bubble.textContent = WORD[state] || WORD.normal;
    emote.textContent = EMOTE[state] || '';
    applyWear(lastWear); // normal 时恢复渐变，其他状态清掉内联样式让 class 生效
  });

  window.buddy.onStats((s) => {
    statsEl.textContent = `完成 ${s.completedCount} · 跳过 ${s.skippedCount} · 喝水 ${s.waterCount} · 连续 ${s.streak} 天`;
  });

  const sitline = document.getElementById('sitline');
  window.buddy.onVitals((v) => {
    applyWear(v.progress || 0);
    if (v.pausedUntil) {
      const d = new Date(v.pausedUntil);
      sitline.innerHTML = `⏸ 已暂停到 ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    } else if (v.sittingMin < 1) {
      sitline.textContent = '刚坐下，状态很好 ✨';
    } else {
      const next = v.nextInMin <= 0 ? '等你停手就提醒' : `下次提醒 ~${v.nextInMin} 分后`;
      sitline.innerHTML = `已连坐 <b>${v.sittingMin}</b> 分 · ${next}`;
    }
  });

  // 手动拖拽 + 点击识别（因为不能用 -webkit-app-region:drag，否则 click 不触发）
  const wrap = document.getElementById('wrap');
  let down = false, moved = false, sx = 0, sy = 0, offX = 0, offY = 0;

  wrap.addEventListener('pointerdown', (e) => {
    down = true; moved = false;
    sx = e.screenX; sy = e.screenY;
    offX = e.clientX; offY = e.clientY;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove', (e) => {
    if (!down) return;
    if (Math.abs(e.screenX - sx) > 3 || Math.abs(e.screenY - sy) > 3) moved = true;
    if (moved) window.buddy.moveWindow(e.screenX - offX, e.screenY - offY);
  });
  wrap.addEventListener('pointerup', (e) => {
    if (down && !moved) window.buddy.togglePanel(); // 没拖动 = 点击 → 开面板
    down = false;
    try { wrap.releasePointerCapture(e.pointerId); } catch {}
  });

  window.buddy.requestStats();
</script>
</body>
</html>
